name: S3 Paper Alerts

# PAPER_ONLY S3 book (LEARNINGS.md 20.4): evening stop alerts for open S3 paper positions and the resting orders for the next session.
# Completely separate from the policy-P workflows: own message prefix, same Telegram bot and chat as the rest of the system
# (TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID), own MongoDB collections (s3_paper_*).  It never touches `positions` or `signals`.
# 13:20 UTC = 18:50 IST, after the 18:30 IST stop_loss_update run has refreshed the candle cache.  GitHub schedules can start late; the
# message reports the data date and says STALE when the cache lacks the last completed session.

on:
  schedule:
    - cron: '20 13 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print only: send nothing, store nothing'
        required: false
        default: false
        type: boolean

jobs:
  s3-paper-alerts:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --retries 10 --timeout 120 -r requirements.txt

      - name: Run S3 paper alerts
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          S3_PAPER_CAPITAL: ${{ vars.S3_PAPER_CAPITAL || '100000' }}
        run: |
          if [ -z "$MONGO_URI" ]; then echo "MONGO_URI is missing"; exit 1; fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python s3_paper_alerts.py --dry-run
          else
            python s3_paper_alerts.py
          fi
