name: S3 Paper Alerts

# PAPER_ONLY S3 book (LEARNINGS.md 20.4): evening stop alerts for open S3 paper positions and the resting orders for the next session.
# Completely separate from the policy-P workflows: own message prefix, same Telegram bot and chat as the rest of the system
# (TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID), own MongoDB collections (s3_paper_*).  It never touches `positions` or `signals`.
# 13:20 UTC = 18:50 IST.  The shared candle cache only holds sessions up to the previous day at this hour (the 18:30 run refreshes only policy-P
# holdings), so the job fetches the missing completed bars itself from Upstox, in memory (core/s3_refresh.py, needs UPSTOX_ACCESS_TOKEN).
# GitHub schedules can start late (the 2026-11-04 run started 7 hours late), so the Cloudflare dispatcher (cloudflare-dispatcher/src/index.js, 13:15 UTC)
# also starts this workflow; whichever start comes second exits without repeating the alert (s3_store.run_already_sent).  Redeploy the worker
# (`npx wrangler deploy` in cloudflare-dispatcher/) for the dispatcher entry to take effect.
# The message reports the data date and says STALE when the last completed session could not be loaded.

on:
  schedule:
    - cron: '20 13 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print only: send nothing, store nothing'
        required: false
        default: false
        type: boolean

# The Cloudflare dispatcher (13:15 UTC) and the cron above (13:20 UTC) can overlap: queue the second start instead of running both at once.
# It then finds today's heartbeat (s3_store.run_already_sent) and exits without repeating the alert.
concurrency:
  group: s3-paper-alerts
  cancel-in-progress: false

jobs:
  s3-paper-alerts:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --retries 10 --timeout 120 -r requirements.txt

      - name: Run S3 paper alerts
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          S3_PAPER_CAPITAL: ${{ vars.S3_PAPER_CAPITAL || '100000' }}
        run: |
          if [ -z "$MONGO_URI" ]; then echo "MONGO_URI is missing"; exit 1; fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python s3_paper_alerts.py --dry-run
          else
            python s3_paper_alerts.py
          fi
